name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 脚本在当前 package.json 中不存在，暂不纳入
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Music
        uses: actions/checkout@v4
        with:
          path: Music

      # 关键：脚本里写的是 cd ../NeteaseCloudMusicApi
      # 因此必须 clone 成 Music 的兄弟目录
      - name: Checkout NeteaseCloudMusicApi (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: NeteaseCloudMusicApiEnhanced/api-enhanced
          path: NeteaseCloudMusicApi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.1
          cache: 'pnpm'
          cache-dependency-path: Music/pnpm-lock.yaml

      - name: Install Music dependencies
        working-directory: Music
        run: pnpm install --frozen-lockfile

      # 走仓库自带的 installer:build:* 脚本
      # 该脚本内部会再 cd ../NeteaseCloudMusicApi 并 npm install
      - name: Build installer
        working-directory: Music
        run: pnpm installer:build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: |
            Music/dist/**/*.exe
            Music/dist/**/*.dmg
            Music/dist/**/*.blockmap
            Music/dist/**/*.yml
            Music/installer/**/*.exe
            Music/installer/**/*.dmg
            Music/installer/**/*.blockmap
            Music/installer/**/*.yml
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
